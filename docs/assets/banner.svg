<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080E1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>

    <!-- Aquamarine Accent Gradient -->
    <linearGradient id="aquaGradBanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- Ambient Glow behind UI card -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="400" fill="url(#bannerBg)"/>

  <!-- Background Grid -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400"/>
  </g>

  <!-- Ambient Light Sphere -->
  <circle cx="850" cy="200" r="280" fill="url(#ambientGlow)"/>

  <!-- LEFT SECTION: Branding & Text -->
  <g transform="translate(80, 80)">
    <!-- Small Embedded Icon -->
    <g transform="scale(0.22)">
      <rect width="512" height="512" rx="128" fill="#0F172A"/>
      <path d="M 256 175 C 210 115, 120 130, 120 220 C 120 305, 256 395, 256 395 C 256 395, 392 305, 392 220 C 392 130, 302 115, 256 175 Z" fill="none" stroke="url(#aquaGradBanner)" stroke-width="32"/>
      <path d="M 256 205 L 305 225 V 275 C 305 310, 256 335, 256 335 C 256 335, 207 310, 207 275 V 225 Z" fill="#FFFFFF"/>
    </g>

    <!-- App Title -->
    <text x="132" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="-1">ScreenGuard</text>
    
    <!-- Tagline -->
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#94A3B8">Digital Wellbeing, App Limits &amp; Focus Mode</text>
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#00F5D4">Built specifically for Linux Desktops</text>

    <!-- Feature Badges -->
    <g transform="translate(0, 215)">
      <!-- Badge 1 -->
      <rect width="110" height="32" rx="16" fill="#1E293B" stroke="#334155"/>
      <text x="55" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Wayland &amp; X11</text>
      
      <!-- Badge 2 -->
      <rect x="120" width="80" height="32" rx="16" fill="#1E293B" stroke="#334155"/>
      <text x="160" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">Flutter</text>

      <!-- Badge 3 -->
      <rect x="210" width="120" height="32" rx="16" fill="#00F5D4" fill-opacity="0.1" stroke="#00F5D4" stroke-opacity="0.4"/>
      <text x="270" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#00F5D4" text-anchor="middle">100% Private</text>
    </g>
  </g>

  <!-- RIGHT SECTION: Dashboard / Interface Preview Card -->
  <g transform="translate(680, 50)">
    <!-- Main Window Canvas -->
    <rect width="440" height="290" rx="16" fill="#111827" stroke="#1F2937" stroke-width="2"/>
    
    <!-- Window Header Controls -->
    <circle cx="24" cy="20" r="5" fill="#EF4444"/>
    <circle cx="40" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="20" r="5" fill="#10B981"/>

    <!-- Dashboard Content Mockup -->
    <!-- Donut Chart Ring -->
    <circle cx="110" cy="140" r="48" fill="none" stroke="#1E293B" stroke-width="16"/>
    <circle cx="110" cy="140" r="48" fill="none" stroke="#00F5D4" stroke-width="16" stroke-dasharray="210 300" transform="rotate(-90 110 140)"/>
    <text x="110" y="145" font-family="sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">3h 42m</text>

    <!-- Weekly Bars -->
    <g transform="translate(200, 90)">
      <rect x="0" y="60" width="18" height="40" rx="4" fill="#334155"/>
      <rect x="28" y="30" width="18" height="70" rx="4" fill="#334155"/>
      <rect x="56" y="10" width="18" height="90" rx="4" fill="#00F5D4"/>
      <rect x="84" y="45" width="18" height="55" rx="4" fill="#334155"/>
      <rect x="112" y="20" width="18" height="80" rx="4" fill="#00B4D8"/>
      <rect x="140" y="70" width="18" height="30" rx="4" fill="#334155"/>
      <rect x="168" y="50" width="18" height="50" rx="4" fill="#334155"/>
    </g>

    <!-- App Usage Bars -->
    <g transform="translate(30, 220)">
      <rect width="380" height="12" rx="6" fill="#1E293B"/>
      <rect width="240" height="12" rx="6" fill="#00F5D4"/>
      <rect y="24" width="380" height="12" rx="6" fill="#1E293B"/>
      <rect y="24" width="140" height="12" rx="6" fill="#00B4D8"/>
    </g>
  </g>
</svg>
