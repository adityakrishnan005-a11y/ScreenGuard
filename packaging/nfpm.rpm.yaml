name: screenguard
arch: amd64
platform: linux
version: 0.1.1~beta3
section: utils
priority: optional
maintainer: Aditya Krishnan <aditya.krishnan005@gmail.com>
description: |
  ScreenGuard — Digital Wellbeing for Linux (Screen time tracking, daily app limits & focus mode).
vendor: ScreenGuard
homepage: https://example.com/screenguard
license: GPL-3.0

contents:
  - src: build/linux/x64/release/bundle/
    dst: /opt/screenguard
  - src: assets/icons/screenguard.svg
    dst: /usr/share/icons/hicolor/scalable/apps/screenguard.svg
  - src: assets/icons/512x512/screenguard.png
    dst: /usr/share/icons/hicolor/512x512/apps/screenguard.png
  - src: assets/icons/256x256/screenguard.png
    dst: /usr/share/icons/hicolor/256x256/apps/screenguard.png
  - src: assets/icons/128x128/screenguard.png
    dst: /usr/share/icons/hicolor/128x128/apps/screenguard.png
  - src: assets/icons/64x64/screenguard.png
    dst: /usr/share/icons/hicolor/64x64/apps/screenguard.png
  - src: assets/icons/48x48/screenguard.png
    dst: /usr/share/icons/hicolor/48x48/apps/screenguard.png
  - src: assets/icons/32x32/screenguard.png
    dst: /usr/share/icons/hicolor/32x32/apps/screenguard.png
  - src: assets/icons/256x256/screenguard.png
    dst: /usr/share/pixmaps/screenguard.png
  - src: /opt/screenguard/screenguard
    dst: /usr/bin/screenguard
    type: symlink
  - src: build/linux/x64/release/bundle/screenguard-daemon
    dst: /usr/bin/screenguard-daemon
  - src: linux/screenguard.service
    dst: /usr/lib/systemd/user/screenguard.service
  - src: linux/screenguard.desktop
    dst: /usr/share/applications/screenguard.desktop
  - src: linux/screenguard-autostart.desktop
    dst: /etc/xdg/autostart/screenguard-autostart.desktop
  - src: bin/active_window_helper.py
    dst: /usr/share/screenguard/active_window_helper.py
  - src: tools/enable_fedora_a11y.sh
    dst: /usr/share/screenguard/enable_fedora_a11y.sh
  - src: extension/metadata.json
    dst: /usr/share/gnome-shell/extensions/screenguard@screenguard.app/metadata.json
  - src: extension/extension.js
    dst: /usr/share/gnome-shell/extensions/screenguard@screenguard.app/extension.js

scripts:
  postinstall: tools/enable_fedora_a11y.sh

depends:
  - python3
  - python3-pyatspi
  - xdotool
  - xprop
  - sqlite-libs
