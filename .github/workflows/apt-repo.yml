name: Update APT Repo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install apt-utils (provides apt-ftparchive)
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - name: Download .deb from release
        run: |
          mkdir -p debs
          gh release download "${{ github.event.release.tag_name }}" -p '*.deb' -D debs/
          ls -la debs/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Set up APT repo structure
        run: |
          mkdir -p repo/dists/apt/main/binary-amd64
          cp debs/*.deb repo/dists/apt/main/binary-amd64/

      - name: Generate Packages
        run: |
          cd repo
          apt-ftparchive packages dists/apt/main/binary-amd64 \
            > dists/apt/main/binary-amd64/Packages
          gzip -k -f dists/apt/main/binary-amd64/Packages

      - name: Generate Release
        run: |
          cd repo
          apt-ftparchive release \
            -o APT::FTPArchive::Release::Origin="ScreenGuard" \
            -o APT::FTPArchive::Release::Label="ScreenGuard APT Repository" \
            -o APT::FTPArchive::Release::Suite="apt" \
            -o APT::FTPArchive::Release::Codename="apt" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            dists/apt \
            > dists/apt/Release

      - name: Sign Release
        run: |
          cd repo
          # Binary signature
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            -abs -o dists/apt/Release.gpg dists/apt/Release
          # InRelease (clearsign)
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --clearsign -o dists/apt/InRelease dists/apt/Release
          # Public key for users
          gpg --batch --export --armor > repo/key.asc

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repo
          destination_dir: apt
          force_orphan: false
