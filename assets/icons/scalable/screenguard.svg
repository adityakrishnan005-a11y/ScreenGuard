<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Cerulean Blue Gradient -->
    <linearGradient id="ceruleanBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Deep Shadow for Shield Elevation -->
    <filter id="shieldShadowCerulean" x="140" y="150" width="232" height="235" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#075985" flood-opacity="0.45"/>
    </filter>

    <!-- Inner Border Shine -->
    <linearGradient id="innerShine" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle Tile -->
  <rect width="512" height="512" rx="128" fill="url(#ceruleanBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="url(#innerShine)" stroke-width="4"/>

  <!-- Symmetrical Heart Ring with Side-Sliced Progress Gaps -->
  <g stroke-width="38" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main Primary Arc (Loops Top Cleft, Left Flank, Bottom Tip -> Lower Right Side) -->
    <path d="M 380 120 
             C 330 85, 280 105, 256 145 
             C 232 105, 182 85, 132 120 
             C 72 160, 70 235, 115 300 
             C 165 370, 230 420, 256 442 
             C 282 420, 335 378, 380 325" 
          stroke="rgba(255, 255, 255, 0.70)"/>

    <!-- Secondary Side Slice Arc (Right Flank Slice) -->
    <path d="M 412 285 
             C 438 245, 438 185, 412 150" 
          stroke="rgba(255, 255, 255, 0.35)"/>
  </g>

  <!-- Double-Layered Security Shield Frame -->
  <g filter="url(#shieldShadowCerulean)">
    <!-- 1. Outer White Shield Frame -->
    <path d="M 256 175 
             C 222 189, 192 194, 175 200 
             C 175 262, 194 318, 256 352 
             C 318 318, 337 262, 337 200 
             C 320 194, 290 189, 256 175 Z" 
          fill="#FFFFFF"/>

    <!-- 2. Inner Shield Gap / Deep Cerulean Inset -->
    <path d="M 256 190 
             C 227 201, 200 205, 188 210 
             C 188 260, 204 307, 256 336 
             C 308 307, 324 260, 324 210 
             C 312 205, 285 201, 256 190 Z" 
          fill="#075985"/>

    <!-- 3. Core Inner Shield - Ice Cerulean Shaded Left Half -->
    <path d="M 256 199 
             C 231 208, 208 212, 197 216 
             C 197 256, 211 297, 256 323 
             V 199 Z" 
          fill="#E0F2FE"/>

    <!-- 4. Core Inner Shield - Pure White Bright Right Half -->
    <path d="M 256 199 
             V 323 
             C 301 297, 315 256, 315 216 
             C 304 212, 281 208, 256 199 Z" 
          fill="#FFFFFF"/>
  </g>
</svg>
